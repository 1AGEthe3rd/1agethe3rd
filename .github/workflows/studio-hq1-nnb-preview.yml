name: Audit Studio HQ1 and NNB globe previews
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Serve Studio from draft
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/studio-server.log 2>&1 &
          sleep 2
      - name: Render actual HQ1 and NNB globe previews
        run: |
          mkdir -p review
          node <<'NODE'
          const {chromium} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',headless:true,
              args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']
            });
            let failed=false;
            for (const [device,width,height,mobile] of [
              ['desktop',1366,768,false],['iphone-portrait',390,844,true],['iphone-landscape',844,390,true]
            ]) {
              const context=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile,deviceScaleFactor:1});
              const page=await context.newPage();
              try {
                await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1500);
                const guide=page.locator('dialog.gesture-guide');
                if(await guide.isVisible())await page.locator('[data-dismiss-guide]').click();
                const order=await page.locator('.project-planet').evaluateAll(nodes=>nodes.map(el=>el.dataset.name));
                if(order.join(',')!=='1AGE,HQ1,HQ2,NLC,NNB,SMIFF') {console.error('Unexpected dial order',order);failed=true;}
                for (const [name,index,expected] of [
                  ['hq1',1,'https://1age.space/hq1/?preview=1'],
                  ['nnb',4,'https://nonamebesuto.com/?preview=1']
                ]) {
                  await page.evaluate(i=>window.dispatchEvent(new CustomEvent('1age-project-preview',{detail:i})),index);
                  await page.waitForTimeout(6000);
                  const src=await page.locator('iframe.project-live').getAttribute('src').catch(()=>null);
                  const canvas=await page.frameLocator('iframe.project-live').locator('canvas').count().catch(()=>0);
                  console.log(device,name,{src,canvas});
                  await page.screenshot({path:'review/studio-'+name+'-'+device+'.png',timeout:15000});
                  if(src!==expected||canvas<1)failed=true;
                }
              } catch(error) {failed=true;console.error(device,error);}
              await context.close();
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Upload studio scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-hq1-nnb-globe-previews
          path: review/
          if-no-files-found: warn
          retention-days: 14
